import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import de.undercouch.gradle.tasks.download.Download
import de.undercouch.gradle.tasks.download.Verify

plugins {
    id 'java-test-fixtures'
    alias(libs.plugins.shadow)
    alias(libs.plugins.errorprone)
}
apply from: rootProject.file('gradle/proto.gradle')
apply from: rootProject.file('gradle/publishing.gradle')

dependencies {
    annotationProcessor project(':fdb-java-annotations')
    api project(':fdb-extensions')

    api(libs.protobuf)
    implementation(libs.slf4j.api)
    implementation(libs.guava)
    compileOnly(libs.jsr305)
    compileOnly(libs.jspecify)
    compileOnly(libs.autoService)
    annotationProcessor(libs.autoService)

    errorprone(libs.errorprone.core)
    errorprone(libs.nullaway)

    testImplementation project(':fdb-test-utils')
    // Guardiann structural-invariant assertions + SIFT dataset loaders/paths live in fdb-extensions' testFixtures
    // (GuardiannStructureAsserts, VecsDatasetLoaders, SiftTestHelpers, PrimaryKeyAndVector), reused by the vector-index
    // tests here (e.g. GuardiannVectorIndexConcurrentMergeTest).
    testImplementation(testFixtures(project(':fdb-extensions')))
    testImplementation(libs.bundles.test.impl)
    testRuntimeOnly(libs.bundles.test.runtime)
    testCompileOnly(libs.bundles.test.compileOnly)
    testCompileOnly(libs.jspecify)
    testImplementation(libs.jcommander)
    testImplementation(libs.apache.commonsMath3)
    testImplementation(libs.junit.platform)
    testImplementation(libs.protobuf.util)
    testCompileOnly(libs.spotbugs.annotations)
    testImplementation(libs.snakeyaml)

    testAnnotationProcessor(libs.autoService)

    // Test fixtures expose base classes (FDBRecordStoreTestBase, etc.) and utility classes
    // (TestKeySpace, FDBDatabaseExtension, etc.) that are consumed by other sub-modules
    // (icu, lucene, spatial). Anything that appears in moved class signatures must use the
    // `Api` configuration so it transitively reaches those consumers.
    testFixturesApi project(':fdb-test-utils')
    testFixturesApi(libs.bundles.test.impl)
    testFixturesImplementation(libs.bundles.test.compileOnly)
    testFixturesImplementation(libs.snakeyaml)
    testFixturesImplementation(libs.protobuf.util)
    testFixturesCompileOnly(libs.jsr305)
    testFixturesCompileOnly(libs.jspecify)
    testFixturesAnnotationProcessor(libs.autoService)
}

sourceSets {
    main {
        java.srcDir ".out/generated/sources/annotationProcessor/java/main/"
    }
}

// jspecify + NullAway, scoped to this module. See @NullMarked package-info.java files under
// com.apple.foundationdb.record (this module's single root package). Protobuf-generated
// metadata/plan-serialization code that lives in its own dedicated generated-only subpackage is
// carved out via UnannotatedSubPackages. A handful of generated proto outer classes are instead
// emitted directly into packages that also contain hand-annotated source
// (com.apple.foundationdb.record and com.apple.foundationdb.record.provider.foundationdb.keyspace),
// so package-level exclusion would also blind NullAway to the hand-written classes they share a
// package with; those are carved out individually via ExcludedClasses instead (this list is tied
// 1:1 to record_metadata.proto, record_cursor.proto, index_build.proto,
// record_metadata_options.proto, record_planner_config.proto, pending_writes_queue.proto,
// time_window_leaderboard.proto, resolver_state.proto, record_sorting.proto,
// string_interning_data.proto, tuple_fields.proto, keyspace.proto, and the 14 testFixtures-only
// test_records_*.proto files (each declares its own protobuf wire-namespace package, e.g.
// com.apple.foundationdb.record.test1, but overrides `option java_package` back to the bare
// com.apple.foundationdb.record package, so they land alongside the hand-written classes above
// -- revisit if those java_outer_classname/java_package values change).
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xmaxerrs', '100000']
    options.errorprone {
        disableAllChecks = true
        error("NullAway")
        option("NullAway:AnnotatedPackages", "com.apple.foundationdb.record")
        option("NullAway:UnannotatedSubPackages", "com.apple.foundationdb.record.planprotos,com.apple.foundationdb.record.expressions,com.apple.foundationdb.record.query.plan.cascades.events.eventprotos")
        option("NullAway:ExcludedClasses", "com.apple.foundationdb.record.RecordMetaDataProto,com.apple.foundationdb.record.RecordCursorProto,com.apple.foundationdb.record.IndexBuildProto,com.apple.foundationdb.record.RecordMetaDataOptionsProto,com.apple.foundationdb.record.RecordPlannerConfigurationProto,com.apple.foundationdb.record.PendingWritesQueueProto,com.apple.foundationdb.record.TimeWindowLeaderboardProto,com.apple.foundationdb.record.ResolverStateProto,com.apple.foundationdb.record.RecordSortingProto,com.apple.foundationdb.record.StringInterningProto,com.apple.foundationdb.record.TupleFieldsProto,com.apple.foundationdb.record.provider.foundationdb.keyspace.KeySpaceProto,com.apple.foundationdb.record.TestRecords1Proto,com.apple.foundationdb.record.TestRecords3Proto,com.apple.foundationdb.record.TestRecords4Proto,com.apple.foundationdb.record.TestRecords4WrapperProto,com.apple.foundationdb.record.TestRecords5Proto,com.apple.foundationdb.record.TestRecordsBytesProto,com.apple.foundationdb.record.TestRecordsEnumProto,com.apple.foundationdb.record.TestRecordsGroupedParentChildProto,com.apple.foundationdb.record.TestRecordsJoinIndexProto,com.apple.foundationdb.record.TestRecordsMultiProto,com.apple.foundationdb.record.TestRecordsTextProto,com.apple.foundationdb.record.TestRecordsTupleFieldsProto,com.apple.foundationdb.record.TestRecordsWithHeaderProto,com.apple.foundationdb.record.TestRecordsWithUnionProto")
        option("NullAway:JSpecifyMode", "true")
        option("NullAway:AcknowledgeRestrictiveAnnotations", "true")
    }
}

// SIFT-small dataset (10k x 128-dim), used by GuardiannVectorIndexConcurrentMergeTest for a realistic
// concurrent insert-vs-index-merge stress test. Mirrors fdb-extensions' siftsmall wiring: downloaded once
// into the shared, clean-surviving asset cache (project.ext.downloadsDirectory), checksum-verified, and
// extracted into the build dir; the .fvecs/.ivecs files are read at test time via the main-code
// com.apple.foundationdb.linear.StoredVecsIterator.
def siftDownloadsDir = project.ext.downloadsDirectory
def siftExtractDir = layout.buildDirectory.dir("extracted")

def downloadSiftsmall = tasks.register('downloadSiftsmall', Download) {
    src 'https://huggingface.co/datasets/vecdata/siftsmall/resolve/3106e1b83049c44713b1ce06942d0ab474bbdfb6/siftsmall.tar.gz'
    dest siftDownloadsDir.file('siftsmall.tar.gz').asFile
    downloadTaskDir siftDownloadsDir.dir("downloads-task")
    onlyIfModified true
    tempAndMove true
    retries 3
    overwrite false
}

def verifySiftsmall = tasks.register('verifySiftsmall', Verify) {
    dependsOn downloadSiftsmall
    src siftDownloadsDir.file('siftsmall.tar.gz').asFile
    algorithm 'SHA256'
    checksum '987b526d24e749082ba27ee8068003836eb17a61b34f09b4db865750f8a43487'
}

tasks.register('extractSiftSmall', Copy) {
    dependsOn verifySiftsmall
    from(tarTree(resources.gzip(siftDownloadsDir.file('siftsmall.tar.gz').asFile)))
    into siftExtractDir
}

tasks.named('test') {
    dependsOn tasks.named('extractSiftSmall')
    inputs.dir siftExtractDir
}

tasks.register('testShadowJar', ShadowJar) {
    archiveClassifier = 'standalone-tests'
    from sourceSets.main.output
    from sourceSets.test.output
    configurations = [ project.configurations.testRuntimeClasspath ]
    manifest {
        inheritFrom project.tasks.jar.manifest
        attributes 'Main-Class': 'com.apple.foundationdb.record.provider.foundationdb.FDBRecordStorePerformanceTest',
                   'Multi-Release': 'true' // https://github.com/johnrengelman/shadow/issues/449
    }
    // Override the duplicates strategy from the EXCLUDE default to INCLUDE, so that duplicate `META-INF/services/*`
    // files reach `mergeServiceFiles()` and their registries merge properly rather than collapse to a single provider.
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    mergeServiceFiles()
}

publishing {
    publications {
        library(MavenPublication) {
            pom {
                // Normally, the variable would be included within the string using variable expansion in a Groovy
                // string. However, the "description" field must be a java.lang.String, hence the use of string
                // concatenation here.
                description = 'A record-oriented layer built for FoundationDB.'
            }
        }
    }
}
