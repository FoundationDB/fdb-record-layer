syntax = "proto2";

package com.apple.foundationdb.record.testindexscenarios;

option java_package = "com.apple.foundationdb.record";
option java_outer_classname = "TestRecordsIndexScenariosProto";

import "record_metadata_options.proto";

// A repeated, nested message. Used both as the source for unnested synthetic record types and to
// carry per-entry (score, timestamp) data for time-window leaderboard indexes.
message ScoreEntry {
  option (com.apple.foundationdb.record.record).usage = NESTED;
  optional int64 score = 1;
  optional int64 timestamp = 2;
  optional int64 context = 3;
}

// Generic, index-type-agnostic container for the field(s) an index is built over. Each index
// definition fills in only the field(s) it indexes (with semantically relevant values); the
// framework wraps the message into a ScenarioRecord. No field-level index annotations are declared:
// the only index in any scenario is the one the definition under test adds.
message IndexedMessage {
  option (com.apple.foundationdb.record.record).usage = NESTED;
  optional int32 int_value = 1;      // VALUE / RANK / ATOMIC(sum,min,max) / BITMAP position / PERMUTED value
  optional int64 long_value = 2;     // MULTIDIMENSIONAL dimension 1 / PERMUTED permuted column
  optional int64 long_value_2 = 3;   // MULTIDIMENSIONAL dimension 2
  optional string string_value = 4;  // TEXT / PERMUTED grouping column
  optional bytes bytes_value = 5;    // VECTOR (raw half-float bytes)
  repeated ScoreEntry entries = 6;   // LEADERBOARD source + unnested synthetic constituent
}

// The key indexable record used by the scenario framework. The framework owns rec_no (primary key)
// and group (the deleteWhere grouping prefix); the definition owns the indexed content.
message ScenarioRecord {
  optional int64 rec_no = 1 [(field).primary_key = true]; // default primary key
  optional int64 group = 2;             // designated grouping field (deleteWhere prefix)
  optional IndexedMessage indexed = 3;  // definition-owned indexable content
  optional int64 other_rec_no = 4;      // foreign key -> OtherScenarioRecord.rec_no (joined type)
  repeated IndexedMessage repeated_indexed = 5; // source for the unnested synthetic record type
}

// Second record type, used as the other constituent of a joined synthetic record type.
message OtherScenarioRecord {
  optional int64 rec_no = 1 [(field).primary_key = true];
  optional int64 group = 2;
}

message RecordTypeUnion {
  optional ScenarioRecord _ScenarioRecord = 1;
  optional OtherScenarioRecord _OtherScenarioRecord = 2;
}
