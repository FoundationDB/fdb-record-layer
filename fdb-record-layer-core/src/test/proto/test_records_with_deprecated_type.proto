syntax = "proto2";

package com.apple.foundationdb.record.withdeprecatedtype;

option java_package = "com.apple.foundationdb.record";
option java_outer_classname = "TestRecordsWithDeprecatedTypeProto";

import "record_metadata_options.proto";

option (schema).split_long_records = true;

message SimpleRecord {
  required int64 rec_no = 1 [(field).primary_key = true];
  optional bytes bytes_value = 2;
}

message DeprecatedType {
  option deprecated = true;
  option (com.apple.foundationdb.record.record).usage = NESTED;
  optional int64 id = 1;
}

message TypeWithDeprecatedField {
  option (com.apple.foundationdb.record.record).usage = NESTED;
  optional int64 id = 1;
  optional string data = 2 [deprecated = true];
}

message RecordTypeUnion {
  option (com.apple.foundationdb.record.record).usage = UNION;
  optional SimpleRecord _SimpleRecord = 1;
}
