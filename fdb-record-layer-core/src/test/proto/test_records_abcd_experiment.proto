syntax = "proto2";

package com.apple.foundationdb.record.abcdexperiment;

option java_package = "com.apple.foundationdb.record";
option java_outer_classname = "TestRecordsAbcdExperimentProto";

// A record with five plain scalar columns, so an experiment can talk about (A, B, C, D, E) directly.
// The primary key is deliberately NOT declared here; each test sets the one it wants.
message AbcdRecord {
  optional int64 a = 1;
  optional int64 b = 2;
  optional int64 c = 3;
  optional int64 d = 4;
  optional int64 e = 5;
}

message RecordTypeUnion {
  optional AbcdRecord _AbcdRecord = 1;
}
