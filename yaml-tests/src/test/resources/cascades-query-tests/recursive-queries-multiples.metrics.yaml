-   query: EXPLAIN with recursive multiples as ( select id from seed union all select
        id from (select id * 2 as id from multiples) as sq where id < 50) select id
        from multiples
    ref: recursive-queries-multiples.yamsql:63
    explain: RUNION q0, q1 { INITIAL { SCAN(<,>) | TFILTER SEED | MAP (_.ID AS ID)
        | INSERT INTO TEMP q1 } RECURSIVE  { TEMP SCAN base() | FILTER _.ID * @c18
        LESS_THAN promote(@c29 AS LONG) | MAP (_.ID * @c18 AS ID) | INSERT INTO TEMP
        q1 }} | MAP (_.ID AS ID)
    task_count: 454
