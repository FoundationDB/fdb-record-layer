-   query: EXPLAIN select str_value_indexed from my_simple_record where num_value_2
        = 101 and str_value_indexed > 'a' order by num_value_2 asc, str_value_indexed
        desc nulls last
    ref: ordering-query.yamsql:82
    explain: 'COVERING(ORDERED_STR_VALUE [EQUALS promote(@c7 AS INT), [LESS_THAN to_ordered_bytes(promote(@c11
        AS STRING), DESC_NULLS_LAST)]] -> [NUM_VALUE_2: KEY:[0], REC_NO: KEY:[2],
        STR_VALUE_INDEXED: from_ordered_bytes(KEY:[1], DESC_NULLS_LAST)]) | MAP (_.STR_VALUE_INDEXED
        AS STR_VALUE_INDEXED, _.NUM_VALUE_2 AS NUM_VALUE_2) | MAP (_.STR_VALUE_INDEXED
        AS STR_VALUE_INDEXED)'
