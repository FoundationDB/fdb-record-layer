ordering-query:
-   query: EXPLAIN select * from my_simple_record where num_value_2 = 100 or num_value_2
        = 101 or num_value_2 = 102 order by num_value_2 asc, str_value_indexed desc
        nulls last
    ref: ordering-query.yamsql:69
    explain: ISCAN(ORDERED_STR_VALUE [EQUALS promote(@c7 AS INT)]) ∪ ISCAN(ORDERED_STR_VALUE
        [EQUALS promote(@c11 AS INT)]) ∪ ISCAN(ORDERED_STR_VALUE [EQUALS promote(@c15
        AS INT)]) COMPARE BY (_.NUM_VALUE_2, to_ordered_bytes(_.STR_VALUE_INDEXED,
        DESC_NULLS_LAST), _.REC_NO)
