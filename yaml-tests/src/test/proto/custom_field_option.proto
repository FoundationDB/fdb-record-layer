syntax = "proto2";

// A minimal, self-contained proto2 extension used only to verify that
// CommandUtil.loadRecordMetaDataFromJson preserves custom FieldOptions extensions when parsing
// metadata JSON, since com.google.protobuf.util.JsonFormat cannot parse proto2 extensions at all.
package com.apple.foundationdb.relational.yamltests.generated.customfieldoption;

option java_outer_classname = "CustomFieldOptionProto";

import "google/protobuf/descriptor.proto";

message CustomFieldOption {
  optional string label = 1;
  optional int64 ordinal = 2;
}

extend google.protobuf.FieldOptions {
  optional CustomFieldOption custom_option = 500000;
}
