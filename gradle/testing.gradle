import java.time.Duration
import java.time.Instant
import java.util.regex.Matcher
import java.util.regex.Pattern

import org.gradle.api.tasks.testing.TestDescriptor
import org.gradle.api.tasks.testing.TestListener

import static TestReporting.betterException
import static TestReporting.getFullDisplayName
import static TestReporting.getMixedModeVersion

apply plugin: 'jacoco'
// configure for test, other *Test are configured below
jacoco {
    toolVersion = rootProject.libs.versions.jacoco.get()
}

// Resolved to the mockito-core jar so it can be installed as a -javaagent on every Test JVM.
// Required on JDK 21+ because Mockito's inline mock maker can no longer self-attach to a
// running VM (see https://javadoc.io/doc/org.mockito/mockito-core/latest/org.mockito/org/mockito/Mockito.html#0.3).
// Under parallel JUnit class execution this also avoids the Byte-Buddy self-attach race that
// manifests as `IllegalStateException: Could not initialize plugin: interface
// org.mockito.plugins.MockMaker`. Hooked into every Test task in `tasks.withType(Test)` below.
configurations {
    mockitoAgent
}
dependencies {
    mockitoAgent(rootProject.libs.mockito) { transitive = false }
}

// if you add to or modify these testing configurations, make sure to update the CONTRIBUTING.md to include any updates
test {
    useJUnitPlatform {
        excludeTags 'WipesFDB'
        excludeTags 'AutomatedTest'
    }
}

tasks.register('destructiveTest', Test) {
    useJUnitPlatform {
        includeTags 'WipesFDB'
        maxParallelForks = 1
    }
    reports {
        junitXml.outputLocation = layout.buildDirectory.dir("test-results/destructive")
    }
}

tasks.register('performanceTest', Test) {
    useJUnitPlatform {
        includeTags 'Performance'
        enableAssertions = false
    }
}

tasks.register('quickTest', Test) {
    systemProperties["tests.runQuick"] = true
    useJUnitPlatform {
        excludeTags 'WipesFDB'
    }
}

// Tests that run similarly to quickTest, but with an embedded RPC server instead of embedded connection
tasks.register('rpcTest', Test) {
    systemProperties["tests.runRPC"] = true
    useJUnitPlatform {
        excludeTags 'WipesFDB'
    }
}

// Tests that run a single version on multiple external servers
tasks.register('singleVersionTest', Test) {
    systemProperties["tests.singleVersion"] = true
    useJUnitPlatform {
        excludeTags 'WipesFDB'
    }
}

// Helpers used from the test-listener closures below. (These live on a class rather than as script-level methods
// because the listeners run at execution time, where a Groovy closure may no longer call back into the build script
// under the Gradle configuration cache.)
class TestReporting {
    static final Pattern SKIPPED_STACK_TRACE_ENTRIES = Pattern.compile(
            /(?s)/ +
            /(?<indent>\s+)at java\.base\/jdk\.internal\.reflect\.NativeMethodAccessorImpl\.invoke0\(Native Method\)/ +
            /\s+at java\.base\/jdk\.internal\.reflect\.NativeMethodAccessorImpl\.invoke\(NativeMethodAccessorImpl\.java:\d+\)/ +
            /\s+at java\.base\/jdk\.internal\.reflect\.DelegatingMethodAccessorImpl\.invoke\(DelegatingMethodAccessorImpl\.java:\d+\)/ +
            /\s+at java\.base\/java\.lang\.reflect\.Method\.invoke\(Method\.java:\d+\)/ +
            /\s+at org\.junit\.platform\.commons\.util\.ReflectionUtils\.invokeMethod\(ReflectionUtils\.java:\d+\).*?/ +
            /(?=\s+Suppressed:|\s+Caused by:|$)/)

    static String betterException(String exception) {
        return SKIPPED_STACK_TRACE_ENTRIES.matcher(exception).replaceAll("\n\${indent}... junit stack ...")
    }

    static def getMixedModeVersion(descriptor) {
        while (descriptor != null) {
            // don't display this or any of the parents. Let's assume that nobody ever
            // sets the display name in code to start with "Gradle Test Executor".
            // it appears to be suffixed with a number, but I didn't investigate why
            if (descriptor.displayName.startsWith("Gradle Test Executor")) {
                break
            }

            Matcher versionMatch = descriptor.displayName =~ /^MultiServer \((?:((?:\d+\.)+\d+) then JDBC In-Process|JDBC In-Process then ((?:\d+\.)+\d+))\)/
            if (versionMatch.size() != 0) {
                def version = versionMatch[0][1]
                if (version == null) {
                    version = versionMatch[0][2]
                }
                return version
            }
            descriptor = descriptor.parent
        }
        return null
    }

    static def getFullDisplayName(TestDescriptor descriptor) {
        def fullName = descriptor.displayName
        descriptor = descriptor.parent
        while (descriptor != null) {
            // don't display this or any of the parents. Let's assume that nobody ever
            // sets the display name in code to start with "Gradle Test Executor".
            // it appears to be suffixed with a number, but I didn't investigate why
            if (descriptor.displayName.startsWith("Gradle Test Executor")) {
                break
            }
            def openParen = descriptor.displayName.indexOf("(")
            // in the case where someone sets the display name to include the method name, it's best
            // to skip the method name itself, e.g.:
            // LuceneIndexMaintenanceTest > randomizedRepartitionTest(boolean, boolean, boolean, int, int, int, long) > randomizedRepartitionTest(true, false, false, 13, 3, 20, 9237590782644) STARTED
            // LuceneIndexMaintenanceTest > randomizedRepartitionTest(boolean, boolean, boolean, int, int, int, long) > randomizedRepartitionTest(true, false, false, 13, 3, 20, 9237590782644) SUCCESS (1985ms)
            if (openParen < 0 || !fullName.startsWith(descriptor.displayName.substring(0, openParen))) {
                fullName = "${descriptor.displayName}" + " > " + fullName
            }
            descriptor = descriptor.parent
        }
        return fullName
    }
}

// Note: If you add to or modify these testing configurations, make sure to update `Building.md` accordingly.
tasks.register('mixedModeTest', Test) {
    useJUnitPlatform {
        includeTags 'MixedMode'
    }

    ignoreFailures = true

    // Skip non-MultiServer yaml tests
    systemProperties['tests.mixedModeOnly'] = 'true'

    def markdownReports = new File("$rootDir/.out/reports/")
    def mixedModeResults = new File(markdownReports, "mixed-mode-results.log")
    doFirst {
        // This may have issues with running tasks concurrently
        if (!markdownReports.exists()) {
            markdownReports.mkdirs()
        }
    }
    addTestListener([
        beforeSuite: { TestDescriptor suite -> },
        afterSuite: { TestDescriptor suite, TestResult result -> },
        beforeTest: { TestDescriptor descriptor -> },
        afterTest: { TestDescriptor descriptor, TestResult result ->
            def version = getMixedModeVersion(descriptor)
            if (version == null) {
                throw new RuntimeException("Could not find version " + getFullDisplayName(descriptor))
            } else {
                mixedModeResults.append("${result.resultType} ${version}\n")
            }
        }
    ] as TestListener)
}

// Use an injected `FileSystemOperations` service for deleting the per-task temp directory in `configureTestTask`
// below (rather than `Project.delete()`, which is not compatible with the configuration cache).
abstract class TestTmpDirCleaner {
    @javax.inject.Inject
    abstract org.gradle.api.file.FileSystemOperations getFs()
}

def testTmpDirCleaner = objects.newInstance(TestTmpDirCleaner)

// Optional wall-clock limits for Test tasks. When a limit is hit, Gradle interrupts the task and fails the build
// (rather than, say, CI cancelling the job), so CI can still publish the test reports (see `recoverTestReports`).
//  - `-DallTest.timeoutMinutes=N` is a single budget shared by every Test task in the build (across all
//    subprojects, whether they run sequentially or in parallel). The clock starts when the first Test task starts.
//  - `-D<taskName>.timeoutMinutes=M` additionally caps each task with that name (e.g. `destructiveTest`).
// Each task's timeout is the smaller of the two, evaluated when the task starts.
//
// The shared deadline lives in a build service: it is created once per build, at execution time, so the deadline
// is not frozen into the configuration cache.
abstract class TestDeadlineService implements BuildService<Params> {
    interface Params extends BuildServiceParameters {
        Property<Integer> getTimeoutMinutes()
    }

    private static final Logger LOGGER = Logging.getLogger(TestDeadlineService)

    private final Instant deadline =
            Instant.now().plus(Duration.ofMinutes(getParameters().getTimeoutMinutes().get()))

    // Called by Gradle when it reads the task's timeout, which happens just before the task starts.
    // `cap` is the task's own `<taskName>.timeoutMinutes` limit, or null if there is none.
    Duration timeoutFor(String taskPath, Duration cap) {
        def remaining = Duration.between(Instant.now(), deadline)
        def timeout = cap != null && cap < remaining ? cap : remaining
        // Gradle requires a positive timeout. If the budget is already used up, time out (nearly) immediately.
        if (timeout < Duration.ofSeconds(1)) {
            timeout = Duration.ofSeconds(1)
        }
        LOGGER.lifecycle("Timeout for ${taskPath}: ${formatDuration(timeout)} " +
                "(shared budget remaining: ${formatDuration(remaining)})")
        return timeout
    }

    private static String formatDuration(Duration duration) {
        // e.g. PT1M55.123S -> 1m 55s
        return duration.withNanos(0).toString().substring(2).replaceAll(/(\d[HMS])(?!$)/, '$1 ').toLowerCase()
    }
}

def testTotalTimeoutMinutes = Integer.getInteger('allTest.timeoutMinutes')
def testDeadlineService = testTotalTimeoutMinutes == null ? null :
        gradle.sharedServices.registerIfAbsent('testDeadline', TestDeadlineService) {
            parameters.timeoutMinutes = testTotalTimeoutMinutes
        }

def configureTestTimeout = { Test task ->
    def taskTimeoutMinutes = Integer.getInteger(task.name + '.timeoutMinutes')
    def taskTimeout = taskTimeoutMinutes == null ? null : Duration.ofMinutes(taskTimeoutMinutes)
    if (testDeadlineService != null) {
        // Capture the path as a String, rather than the task itself, in the provider below.
        def taskPath = task.path
        task.usesService(testDeadlineService)
        task.timeout = testDeadlineService.map { service -> service.timeoutFor(taskPath, taskTimeout) }
    } else if (taskTimeout != null) {
        task.timeout = taskTimeout
    }
}

def configureTestTask = { String propertyPrefix, Task task ->
    def handled = [propertyPrefix + '.ignoreFailures',
                   propertyPrefix + '.debug',
                   propertyPrefix + '.single',
                   propertyPrefix + '.maxParallelForks',
                   propertyPrefix + '.exclude',
                   propertyPrefix + '.forkEvery',
                   propertyPrefix + '.timeoutMinutes']
    System.properties.each { prop ->
        def prefix = "${propertyPrefix}.sysProp."
        if (!prop.key.startsWith(prefix.toString())) {
            return
        }
        def setkey = prop.key.substring(prefix.length())
        task.systemProperties[setkey] = prop.value
        logger.debug "Set system property ${setkey} = ${prop.value} on ${propertyPrefix}"
        handled.add(prop.key)
        return
    }

    def tmpdir = layout.buildDirectory.dir("tmp-${task.name}").get().asFile
    task.doFirst {
        testTmpDirCleaner.fs.delete { delete(tmpdir) }
        tmpdir.mkdirs()
    }
    task.systemProperties['java.io.tmpdir'] = tmpdir.absolutePath
    task.systemProperties['junit.jupiter.extensions.autodetection.enabled'] = 'true'

    // configure test logging
    task.systemProperties['log4j2.configurationFile'] = rootProject.file('gradle/scripts/log4j-test.properties').toURI()
    task.systemProperties['mme.app.useLog4jPropertyConfigurator'] = 'false'

    task.maxParallelForks = Integer.getInteger(propertyPrefix + '.maxParallelForks', 1)
    task.forkEvery = Integer.getInteger(propertyPrefix + '.forkEvery', 0)

    task.debug = Boolean.getBoolean(propertyPrefix + '.debug')
    task.ignoreFailures = Boolean.getBoolean(propertyPrefix + '.ignoreFailures')

    // `<prefix>.timeoutMinutes` is handled separately by `configureTestTimeout` below, since the `allTest`
    // flavor is a budget shared across all Test tasks rather than a per-task setting.

    def excludes = System.getProperty(propertyPrefix + '.exclude')
    if (excludes != null) {
        task.exclude excludes
    }

    if (task.name != 'performanceTest') {
        // Configure whether or not tests will validate that asyncToSync isn't being called in async
        // context.  See BlockingInAsyncDetection class for details on values.
        // disable BLOCKING_DETECTION to better simulate performance
        task.systemProperties["com.apple.foundationdb.record.blockingInAsyncDetection"] =
            System.getenv('BLOCKING_DETECTION') ?: "IGNORE_COMPLETE_EXCEPTION_BLOCKING"
    }

    def reportsDirProperty = "${task.name}.reportsDir".toString()
    handled.add(reportsDirProperty)
    def reportsDir = System.getProperty(reportsDirProperty)
    if (reportsDir != null) {
        task.reports.junitXml.destination = reportsDir
    }

    System.properties.each { prop ->
        if (prop.key.startsWith(propertyPrefix + '.') && !handled.contains(prop.key)) {
            logger.warn "Unknown system property that looks like it was intended to configure this task: ${prop.key}=${prop.value}"
        }
        return
    }
}

tasks.withType(Test).configureEach { Test theTask ->
    // Point the `Test` task at the compiled classes and the runtime classpath of the test source-set.
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    // Raise the default heap size for the forked worker JVMs that run the tests. (Gradle’s default is only 512 MB.)
    maxHeapSize = '4g'

    configureTestTask('allTest', theTask)
    configureTestTask(theTask.name, theTask)
    configureTestTimeout(theTask)
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
    // This creates two reports to be picked up by the gradle actions (see actions/gradle-test/action.yml)
    // We initialize the files here, to be filled out by test listeners below
    // summary has a summary of all the test tasks we ran, and the success/skipped/failure counts & duration
    // failures includes any failures that happened, with the stack trace
    def markdownReports = new File("$rootDir/.out/reports/")
    def summary = new File(markdownReports, "test-summary.md")
    def failures = new File(markdownReports, "test-failures.md")
    doFirst {
        // This may have issues with running tasks concurrently
        if (!markdownReports.exists()) {
            markdownReports.mkdirs()
        }
        if (!summary.exists()) {
            summary.append("|Test run|❌|⚠️|✅|time|\n")
            summary.append("|-|-|-|-|-|\n")
        }
    }

    addTestListener([
        beforeSuite: { TestDescriptor suite -> },
        beforeTest: { TestDescriptor descriptor ->
            println "${Instant.now()} ${getFullDisplayName(descriptor)} STARTED"
        },
        afterTest: { TestDescriptor descriptor, TestResult result ->
            def duration = String.format(Locale.ROOT, "%,d", result.endTime - result.startTime)
            println "${Instant.now()} ${getFullDisplayName(descriptor)} ${result.resultType} (${duration}ms)"
            println()
            if (result.resultType == TestResult.ResultType.FAILURE) {
                failures.append(
                    "<details>\n" +
                        "<summary> ❌ ${getFullDisplayName(descriptor)}</summary>\n" +
                        "(${duration}ms)\n\n" + // blank line is required for ``` to work
                        "```\n${betterException(result.getException().asString())}\n```\n" +
                    "</details>\n")
            }
        },
        afterSuite: { descriptor, result ->
            // Very few subprojects acutally have destructive or mixed-mode tests, so strip those out of the summary.
            // We leave the ones that have nothing under test, because that would be suspicious if a subproject had
            // no tests
            if (descriptor.parent == null
                && !(descriptor.toString().endsWith(":destructiveTest") && result.getTestCount() == 0)
                && !(descriptor.toString().endsWith(":mixedModeTest") && result.getTestCount() == 0)) {
                def duration = String.format(Locale.ROOT, "%,d", result.endTime - result.startTime)
                def description = descriptor.toString().replaceFirst("Gradle Test Run ", "")
                summary.append(
                    "|${description}|${result.getFailedTestCount()}|${result.getSkippedTestCount()}|${result.getSuccessfulTestCount()}|${duration}ms|\n")
            }
        }
    ] as TestListener)
    reports {
        junitXml.outputPerTestCase = true
    }
}

tasks.withType(Test).configureEach { task ->
    if (task.name != 'performanceTest') {
        // Defensive: ensure the JUnit Platform framework is set before any code below reads
        // `task.testFramework.options.excludeTags`. This callback fires at task-creation time, so
        // tasks declared in subprojects that haven't yet had their configuration closure invoked
        // would still be on the JUnit4 default (which has no excludeTags) without this. Calling
        // useJUnitPlatform() here is a no-op for tasks that already have it.
        task.useJUnitPlatform()

        // Install Mockito as a JVM agent on every non-performance Test task. See the comment on the
        // `mockitoAgent` configuration above for why this is necessary. Deferred to `doFirst`
        // so that the `mockitoAgent` configuration is not resolved during evaluation (which
        // would prevent the root build's `resolutionStrategy.eachDependency` callback from
        // attaching to it).
        // extract during configuration to be cache friendly
        def mockitoAgent = configurations.mockitoAgent
        task.doFirst {
            task.jvmArgs("-javaagent:${mockitoAgent.asPath}")
        }

        // Configure whether or not tests will validate that asyncToSync isn't being called in async
        // context.  See BlockingInAsyncDetection class for details on values.
        // disable BLOCKING_DETECTION to better simulate performance
        task.systemProperties["com.apple.foundationdb.record.blockingInAsyncDetection"] =
                System.getenv('BLOCKING_DETECTION') ?: "IGNORE_COMPLETE_EXCEPTION_BLOCKING"

        // setup tag inclusion/exclusion
        if (project.hasProperty('tests.skipFDB')) {
            task.testFramework.options.excludeTags.add('RequiresFDB')
        }
        if (project.hasProperty('tests.skipSlow')) {
            task.testFramework.options.excludeTags.add('Slow')
            systemProperties["junit.jupiter.execution.timeout.default"] = "2s"
        } else {
            systemProperties["junit.jupiter.execution.timeout.default"] = "5m"
        }
        if (project.hasProperty('tests.nightly')) {
            systemProperties['tests.nightly'] = 'true'
        } else {
            task.testFramework.options.excludeTags.add('SuperSlow')
        }
        if (project.hasProperty('tests.ci')) {
            systemProperties['tests.ci'] = 'true'
        }
        if (project.hasProperty('tests.nightly')) {
            task.ignoreFailures = true
        }
        if (!project.hasProperty('tests.includeRandom')) {
            task.testFramework.options.excludeTags.add('Random')
        } else {
            if (!project.hasProperty('randomTestsLocale')) {
                def random = new Random()
                def availableLocales = Locale.getAvailableLocales()
                rootProject.ext.randomTestsLocale = availableLocales[random.nextInt(availableLocales.size())]
                logger.warn("Running tests with locale: ${rootProject.ext.randomTestsLocale}")
            }
            task.systemProperty('user.language', rootProject.ext.randomTestsLocale.language)
            task.systemProperty('user.country', rootProject.ext.randomTestsLocale.country)
            systemProperties['tests.includeRandom'] = 'true'
        }
        if (project.hasProperty('tests.iterations')) {
            systemProperties['tests.iterations'] = project.getProperty('tests.iterations')
        }
        task.testFramework.options.excludeTags.add('Performance')

        if (task.name == 'test') {
            task.systemProperty('junit.jupiter.execution.parallel.enabled', 'true')
            task.systemProperty('junit.jupiter.execution.parallel.mode.default', 'same_thread')
            task.systemProperty('junit.jupiter.execution.parallel.mode.classes.default', 'same_thread')
            // So far, using the dynamic strategy results in tests that should be fairly fast timing out
            // at 5 minutes. The current theory is some thread pool is saturated and unable to unblock
            // itself. In the meantime, try a fixed 2 threads.
            task.systemProperty('junit.jupiter.execution.parallel.config.strategy', 'fixed')
            task.systemProperty('junit.jupiter.execution.parallel.config.fixed.parallelism', '2')
            // We use worker_thread_pool rather than fork_join_pool because we heavily depend on ForkJoinPool for
            // FDB operations, which causes junit to incorrectly increase the number of concurrent tests to well
            // beyond what we want.
            task.systemProperty('junit.jupiter.execution.parallel.config.executor-service', 'worker_thread_pool')
        }
    }

}

tasks.register('testJar', Jar) {
    dependsOn 'testClasses'
    group = 'Build'
    description = 'Build a jar file of test classes as an exported artifact'
    archiveClassifier = 'test'
    from sourceSets.test.output
}

configurations {
    tests {
        extendsFrom testRuntimeOnly
    }
}

artifacts {
    tests tasks.named('testJar')
}

tasks.register('quickCheck') {
    group = 'Verification'
    description = 'Perform fast build verification'

    dependsOn testClasses
}

// Repairs the HTML test reports of Test tasks that were interrupted, without running any tests. This exists for
// CI: when a test task hits its timeout (see `timeoutMinutes` above), Gradle interrupts it and its normal HTML/XML
// reports end up incomplete (e.g. no `index.html`), but the binary results are intact.
//
// Each Test task `<name>` gets a `<name>RecoverReport` task that regenerates the HTML report from the binary
// results into the Test task's usual report directory. It only does anything if that report is incomplete, so
// complete reports (whether the tests passed or failed) are left alone. `recoverTestReports` runs all of them.
def recoverTestReports = tasks.register('recoverTestReports') {
    group = 'Verification'
    description = 'Regenerate incomplete HTML test reports (e.g. after a timeout) from binary results (does not run tests)'
}

// Use `afterEvaluate` so this also picks up Test tasks registered by the subproject's own build file.
afterEvaluate {
    tasks.withType(Test).names.each { testTaskName ->
        def recoverTask = tasks.register("${testTaskName}RecoverReport", TestReport) {
            group = 'Verification'
            description = "Regenerate the HTML report of ${testTaskName} if it is incomplete (does not run tests)"

            def testTask = tasks.named(testTaskName, Test).get()
            // Never run the tests as part of this, but if both are run, run this afterwards.
            mustRunAfter(testTask)
            def binaryResultsDir = testTask.binaryResultsDirectory.get().asFile
            def htmlReportDir = testTask.reports.html.outputLocation.get().asFile
            // `locationOnly` drops the dependency on the Test task. A directory that does not exist is ignored.
            testResults.from(testTask.binaryResultsDirectory.locationOnly)
            destinationDirectory = htmlReportDir

            // A complete report has an `index.html` written after the binary results.
            onlyIf("the ${testTaskName} HTML report is incomplete") {
                def results = new File(binaryResultsDir, 'results-generic.bin')
                def index = new File(htmlReportDir, 'index.html')
                results.exists() && (!index.exists() || index.lastModified() < results.lastModified())
            }
        }
        recoverTestReports.configure { dependsOn(recoverTask) }
    }
}
