import java.security.MessageDigest
import javax.inject.Inject
import groovy.json.JsonOutput

/**
 * Build configuration specially for the root project only.
 */

apply plugin: 'project-reports'
//apply plugin: 'release'

htmlDependencyReport {
    projects = project.allprojects
}
dependencyReport {
    projects = project.allprojects
}

static def generateMD5(File file) {
    def digest = MessageDigest.getInstance("MD5")
    file.withInputStream() { is ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = is.read(buffer)) > 0) {
            digest.update(buffer, 0, read)
        }
    }
    byte[] md5sum = digest.digest()
    BigInteger bigInt = new BigInteger(1, md5sum)
    bigInt.toString(16).padLeft(32, '0')
}

tasks.register('checksumsVerify') {

    doLast {
        def checksumsFile = file('.checksum')
        def failed = []
        checksumsFile.eachLine { line ->
            if (line.startsWith("#")) { return }
            def parts = line.split('\\s+')
            def name = parts[0]
            def checksum = parts[1]
            def md5 = generateMD5(file(name))
            if (!md5.equalsIgnoreCase(checksum)) {
                failed.add(name)
            }
            return
        }
        if (!failed.empty) {
            throw new RuntimeException("Some MD5 sums failed to verify: " + failed)
        }
    }
}

// Computes, for every subproject, the full set of subprojects that would be affected by a
// change to it (including itself), and emits the result as a JSON object. This uses
// the configured dependencies and then recursively explores the graph so that it stays up
// to date as dependencies are added. Used in CI (see .github/workflows/pull_request.yml)
// to determine which subprojects are affected by a PR's changes.
tasks.register('printDependentSubprojects') {
    def outputPath = findProperty('subprojectDeps.output')
    def outputFile = outputPath ? file(outputPath) : null

    // Direct forward graph: subproject name -> set of subproject names it depends on.
    // Note: We build this graph here, at configuration time, since the `doLast` block below is not allowed to access
    // `subprojects` at execution time under the Gradle configuration cache.
    def forward = subprojects.collectEntries { sp ->
        def deps = new TreeSet<String>()
        sp.configurations.each { cfg ->
            cfg.dependencies.withType(ProjectDependency).each { dep ->
                deps.add(dep.path.replaceFirst(/^:/, ''))
            }
        }
        [sp.name, deps]
    }

    doLast {
        // Reverse graph: subproject name -> set of subprojects that directly depend on it.
        def reverse = forward.keySet().collectEntries { [it, new TreeSet<String>()] }
        forward.each { name, deps ->
            deps.each { dep -> reverse[dep].add(name) }
        }

        // For each subproject, BFS over the reverse graph to find its full transitive impact set
        def affected = forward.keySet().collectEntries { subproject ->
            def seen = new TreeSet<String>([subproject])
            Queue<String> queue = new LinkedList<String>([subproject])
            while (!queue.isEmpty()) {
                def current = queue.poll()
                reverse[current].each { dependent ->
                    if (seen.add(dependent)) {
                        queue.add(dependent)
                    }
                }
            }
            [subproject, seen.toList()]
        }

        def json = JsonOutput.toJson(affected)
        if (outputFile != null) {
            outputFile.text = json
        } else {
            println json
        }
    }
}

apply plugin: 'jacoco'

/**
 * Explodes the main jar of every coverage subproject that actually exists into a single directory
 * of `.class` files, which `codeCoverageReport` then analyzes.
 *
 * The only reason this task exists is to move the "does this subproject's jar exist?" question out
 * of Gradle's configuration phase and into its execution phase. See the comment on
 * `codeCoverageReport` below for why that matters. Everything it needs is declared as task
 * properties and injected services, so it captures no Project state and is configuration-cache
 * safe.
 */
abstract class StageCoverageClasses extends DefaultTask {
    /**
     * The main jar of every coverage subproject. Entries that do not exist are fine: a plain file
     * collection fingerprints them as absent, unlike a `zipTree`, which fails the build as soon as
     * it is resolved.
     */
    @Classpath
    abstract ConfigurableFileCollection getJars()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @Inject
    abstract ArchiveOperations getArchiveOperations()

    @Inject
    abstract FileSystemOperations getFileSystemOperations()

    @TaskAction
    void stage() {
        // THE EXISTENCE CHECK. It runs here, at execution time, so it sees both jars that were
        // built earlier in this same Gradle invocation and jars that were downloaded as CI
        // artifacts before Gradle started.
        def presentJars = jars.files.findAll { it.isFile() }
        def archives = archiveOperations
        // `sync`, not `copy`: classes staged by a previous run for a jar that is no longer present
        // must not leak into the report.
        fileSystemOperations.sync { spec ->
            spec.into(outputDirectory)
            spec.include('**/*.class')
            spec.includeEmptyDirs = false
            presentJars.each { jarFile ->
                // One subdirectory per jar so that identically named entries from different
                // subprojects (module-info.class, package-info.class, ...) cannot collide.
                spec.from(archives.zipTree(jarFile)) { sub ->
                    sub.into(jarFile.name.replaceFirst(/\.jar$/, ''))
                }
            }
        }
    }
}

def coverageSubprojects = subprojects.findAll { sp ->
    sp.name != 'examples' &&
        sp.name != 'fdb-record-layer-core-shaded' &&
        sp.name != 'fdb-record-layer-jmh'
}

// Tasks that produce this report's raw inputs.
// Use mustRunAfter, not dependsOn, so that we can download the jacoco/jar artifacts from parallel
// jobs in our pull_request workflow, and then run codeCoverageReport to merge them without
// rebuilding anything, while still getting the right order when the tests, the jars and the report
// are all requested in a single invocation (such as our nightly builds).
//
// Note that everything below is resolved inside the `tasks.register` configuration closures rather
// than here at script-evaluation time. Subprojects have not been evaluated yet while this file is
// being read, so `sp.version` would still be 'unspecified' and `sp.tasks.withType(Test)` empty.
def coverageInputTasks = {
    def t = coverageSubprojects.collectMany { sp -> sp.tasks.withType(Test) }
    t.addAll(coverageSubprojects.collectMany { sp -> sp.tasks.withType(Jar) })
    return t
}

def coverageJars = {
    coverageSubprojects.collect { sp ->
        sp.layout.buildDirectory.file("libs/${sp.name}-${sp.version}.jar").get().asFile
    }
}

def stagedClassesDir = { layout.buildDirectory.dir('coverage-classes').get().asFile }

def stageCoverageClasses = tasks.register('stageCoverageClasses', StageCoverageClasses) {
    // codeCoverageReport only mustRunAfter the jar tasks, so this task has to carry the same
    // ordering constraint itself; `dependsOn` from codeCoverageReport is not enough to stop Gradle
    // scheduling this before the jars are built.
    mustRunAfter coverageInputTasks()
    jars.setFrom(coverageJars())
    outputDirectory.set(stagedClassesDir())
}

tasks.register('codeCoverageReport', JacocoReport) {
    // fileTree(stagedClassesDir) below carries no producer information, so the dependency on the
    // task that populates it has to be declared explicitly.
    dependsOn stageCoverageClasses
    mustRunAfter coverageInputTasks()

    def data = coverageSubprojects.collectMany { sp ->
        sp.tasks.withType(Test).collect { testTask -> testTask.jacoco.destinationFile }
    }
    executionData data

    // CI merge jobs stage per-job coverage artifacts under `.coverage-data/<artifact-name>/` when
    // unpacking them in place would collide (for example, every mixed-mode matrix leg produces its
    // own `yaml-tests/.out/jacoco/mixedModeTest.exec`). Pick those up alongside the in-tree data.
    // A directory fileTree is lazy under the configuration cache and is simply empty when the
    // directory does not exist, which is the normal case outside CI.
    executionData fileTree(rootProject.file('.coverage-data')) {
        include '**/*.exec'
    }

    // Not much consistency in naming these.
    def exclusions = [
        "**/*Proto.class", "**/*Proto\$*.class",
        "**/planprotos/*", "**/eventprotos/*",
        "**/generated/*", "**/grpc/v1/**/*"
    ]

    // Two constraints have to hold simultaneously here, and the naive implementations satisfy only
    // one of them:
    //
    //  1. A single-invocation build (`jar test ... codeCoverageReport`, see nightly.yml) starts
    //     from a clean checkout, so NO jar exists while this task is being configured. Anything
    //     that decides what to analyze during configuration -- or, with the configuration cache,
    //     while the cache entry is being stored, which is also before any task runs -- yields an
    //     empty report.
    //  2. CI skips building/testing subprojects that a PR's diff could not have affected (see the
    //     `plan` job in pull_request.yml), so some jars legitimately never exist. Referencing a
    //     missing jar through zipTree fails the build outright as soon as this task's inputs are
    //     fingerprinted, so those have to be dropped rather than analyzed.
    //
    // stageCoverageClasses reconciles the two: it performs the existence check in its @TaskAction,
    // that is, at execution time and after the jar tasks, and explodes whatever it finds. What is
    // left here is a directory-backed fileTree, which is the one file-collection primitive that is
    // both lazy under the configuration cache (it is serialized as a directory plus pattern spec
    // and walked when this task's inputs are fingerprinted) and tolerant of a missing directory,
    // which yields an empty tree rather than an error.
    classDirectories.setFrom(fileTree(stagedClassesDir()) {
        exclude exclusions
    })

    // These come from the source tree, so they are listed for every coverage subproject whether or
    // not it was built: JaCoCo filters out source directories it has no analyzed classes for.
    //
    // Only the checked-in *Java* source directories, though. Resource directories are of no use to
    // JaCoCo, and both they and the generated sources (protobuf under `.out/generated`, the
    // version properties under `fdb-relational-api/src/gen`) are task outputs, so naming them here
    // makes Gradle demand a dependency on generateProto/compileJava/createVersionPropertiesFile.
    // That would force a compile in exactly the coverage-only CI jobs that deliberately run
    // against downloaded jars. Generated classes are excluded from classDirectories above anyway,
    // so there is nothing to map them back to.
    def sourceDirs = coverageSubprojects.collectMany { sp ->
        def buildPath = sp.layout.buildDirectory.get().asFile.toPath()
        sp.sourceSets.main.java.srcDirs.findAll { !it.toPath().startsWith(buildPath) }
    }
    sourceDirectories.setFrom(files(sourceDirs))

    reports {
        xml.required = true
        html.required = true
    }
}

// Seed empty jacoco execution data files at the paths codeCoverageReport reads, so that a
// coverage report can still be generated when no tests actually ran (e.g. a pull_request build
// whose diff affected no coverage subproject). codeCoverageReport has a built-in onlyIf that
// skips it unless at least one execution data file exists; an empty (zero-byte) .exec loads as
// an empty execution-data store, which yields a full-codebase 0% report when combined with the
// subproject jars. This task only creates files that don't already exist, so it never clobbers
// real coverage data and is a no-op on normal test/coverage runs.
tasks.register('createEmptyCoverageData') {
    // Resolve the destination files to plain File objects at configuration time (mirroring how
    // codeCoverageReport builds its executionData) so the doLast action captures only a
    // serializable List<File> and stays compatible with the configuration cache.
    def execFiles = coverageSubprojects.collectMany { sp -> sp.tasks.withType(Test) }.collect { testTask ->
        def dest = testTask.jacoco.destinationFile
        (dest instanceof Provider) ? dest.get().asFile : dest as File
    }
    doLast {
        execFiles.each { execFile ->
            if (!execFile.exists()) {
                execFile.parentFile.mkdirs()
                execFile.createNewFile()
            }
        }
    }
}
